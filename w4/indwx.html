<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日式櫻花風格 - 朋友對我的動態留言板</title>
  
  <!-- 引入 Google Fonts 典雅日式字型 (Noto Serif TC / Zen Antique) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Zen+Antique&display=swap" rel="stylesheet">
  
  <!-- FontAwesome 圖示庫 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* ==========================================================================
       【1. 主題顏色與變數設定區 (您可以直接在此修改顏色與特效參數)】
       ========================================================================== */
    :root {
      /* 【主題色彩控制】 */
      --bg-color: #fcf8f6;           /* 網頁背景色 (日式暖白和紙感) */
      --primary-sakura: #e06d88;     /* 主色調：櫻粉色 (主要標題、重點外框) */
      --primary-hover: #c9526f;      /* 按鈕懸停色 */
      --vermilion-accent: #d94b36;   /* 朱紅點綴色 (印章、櫻花微標誌) */
      --gold-accent: #d4af37;        /* 金箔點綴色 (高亮與日式質感飾邊) */
      
      /* 【卡片與字體】 */
      --text-main: #3a2e2b;          /* 主要文字顏色 (深木褐) */
      --text-sub: #8c7676;           /* 時間與副標題文字 (淺灰褐) */
      --card-bg: rgba(255, 253, 250, 0.92); /* 卡片背景色 (半透明和紙白) */
      --card-border: rgba(224, 109, 136, 0.25); /* 一般卡片和紙邊框 */
      
      /* 【輪播高亮 (Highlight) 特效設定】 */
      --highlight-scale: 1.05;       /* 高亮卡片的放大倍率 (預設 1.05 倍) */
      --highlight-border: #e06d88;    /* 高亮時卡片邊框顏色 */
      /* 高亮時的發光與微金箔外光暈效果 */
      --highlight-glow: 0 15px 35px rgba(224, 109, 136, 0.4), 0 0 18px rgba(212, 175, 55, 0.35); 
      
      /* 【未被選中卡片的淡化效果】 */
      --dim-opacity: 0.45;           /* 未選中卡片的透明度 (0.1 ~ 1.0) */
      --dim-blur: blur(2px);         /* 未選中卡片的模糊程度 */
      
      --font-family: 'Noto Serif TC', 'Zen Antique', serif;
    }

    /* 全局樣式重置 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-family);
      background-color: var(--bg-color);
      /* 背景帶有細緻的和紙紋理感漸層 */
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(255, 235, 238, 0.6) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(252, 228, 236, 0.6) 0%, transparent 40%);
      color: var(--text-main);
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
      padding-bottom: 80px;
    }

    /* 滿屏櫻花飄落 Canvas Canvas */
    #sakuraCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none; /* 防止遮擋鼠標點擊事件 */
      z-index: 1;
    }

    /* 主頁面容器 */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 30px 20px;
      position: relative;
      z-index: 2;
    }

    /* 頁首標題區 */
    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .header h1 {
      font-size: 2.3rem;
      color: var(--primary-sakura);
      letter-spacing: 4px;
      text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.9);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .header p {
      color: var(--text-sub);
      font-size: 0.98rem;
      letter-spacing: 2px;
    }

    /* ==========================================================================
       【2. CSV 控制列與輪播播放控制區】
       ========================================================================== */
    .control-panel {
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(10px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px 20px;
      margin-bottom: 30px;
      box-shadow: 0 4px 20px rgba(224, 109, 136, 0.08);
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }

    .input-row {
      display: flex;
      width: 100%;
      gap: 10px;
      flex-wrap: wrap;
    }

    .input-group {
      flex: 1;
      min-width: 260px;
    }

    .input-group input {
      width: 100%;
      padding: 10px 16px;
      border-radius: 8px;
      border: 1.5px solid var(--card-border);
      outline: none;
      font-family: inherit;
      font-size: 0.92rem;
      background: rgba(255, 255, 255, 0.95);
      color: var(--text-main);
      transition: all 0.3s ease;
    }

    .input-group input:focus {
      border-color: var(--primary-sakura);
      box-shadow: 0 0 8px rgba(224, 109, 136, 0.3);
    }

    .btn {
      background: linear-gradient(135deg, var(--primary-sakura), #d85c79);
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 0.95rem;
      font-family: inherit;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 3px 10px rgba(224, 109, 136, 0.3);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn:hover {
      background: linear-gradient(135deg, var(--primary-hover), #b84a65);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.9);
      color: var(--text-main);
      border: 1px solid var(--card-border);
    }

    .btn-secondary:hover {
      background: #fff0f3;
      color: var(--primary-sakura);
    }

    /* 展覽輪播操作列 */
    .carousel-controls {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-top: 6px;
      border-top: 1px dashed rgba(224, 109, 136, 0.2);
      width: 100%;
      justify-content: center;
      font-size: 0.88rem;
    }

    .status-badge {
      padding: 4px 10px;
      border-radius: 12px;
      background: #fce4ec;
      color: var(--primary-sakura);
      font-size: 0.8rem;
      font-weight: 600;
    }

    /* ==========================================================================
       【3. 日式風格 Loading 載入動畫】
       ========================================================================== */
    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 70px 0;
      gap: 16px;
    }

    .sakura-spinner {
      font-size: 3.2rem;
      color: var(--primary-sakura);
      animation: spinAndGlow 2.2s infinite cubic-bezier(0.45, 0.05, 0.55, 0.95);
      filter: drop-shadow(0 0 10px rgba(224, 109, 136, 0.5));
    }

    @keyframes spinAndGlow {
      0% { transform: rotate(0deg) scale(0.88); opacity: 0.7; }
      50% { transform: rotate(180deg) scale(1.15); opacity: 1; }
      100% { transform: rotate(360deg) scale(0.88); opacity: 0.7; }
    }

    .loading-text {
      font-size: 1.15rem;
      letter-spacing: 4px;
      color: var(--primary-sakura);
      font-weight: 600;
    }

    /* ==========================================================================
       【4. 瀑布流留言牆 (Masonry Layout) & 短冊/繪馬風卡片】
       ========================================================================== */
    .masonry-wall {
      /* CSS column-count 實現瀑布流 */
      column-count: 3;
      column-gap: 24px;
      transition: all 0.5s ease;
    }

    /* 響應式斷點 */
    @media (max-width: 992px) { .masonry-wall { column-count: 2; } }
    @media (max-width: 600px) { .masonry-wall { column-count: 1; } }

    /* 單張留言卡片 (日式詩歌紙籤/短冊風格) */
    .card {
      break-inside: avoid; /* 避免卡片跨欄斷開 */
      margin-bottom: 24px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 22px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.02);
      position: relative;
      transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1), 
                  box-shadow 0.6s ease, 
                  filter 0.6s ease, 
                  opacity 0.6s ease,
                  border-color 0.6s ease;
      cursor: pointer;
      backdrop-filter: blur(5px);
      overflow: hidden;
    }

    /* 短冊卡片頂部日式紅線繩打結質感裝飾 */
    .card::after {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 40px;
      height: 3px;
      background: var(--vermilion-accent);
      border-radius: 0 0 4px 4px;
    }

    /* 日式櫻花朱紅印章視覺點綴 */
    .card-stamp {
      position: absolute;
      bottom: 12px;
      right: 12px;
      width: 32px;
      height: 32px;
      border: 1.5px solid var(--vermilion-accent);
      color: var(--vermilion-accent);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.72rem;
      font-weight: 700;
      opacity: 0.35;
      transform: rotate(-12deg);
      user-select: none;
      pointer-events: none;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      padding-bottom: 8px;
      border-bottom: 1px dashed rgba(224, 109, 136, 0.2);
    }

    .author-name {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--primary-sakura);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .author-name i {
      font-size: 0.82rem;
      color: var(--gold-accent);
    }

    .post-time {
      font-size: 0.78rem;
      color: var(--text-sub);
    }

    .card-content {
      font-size: 0.98rem;
      line-height: 1.75;
      color: var(--text-main);
      white-space: pre-wrap; /* 保留原留言換行 */
      word-break: break-word;
      position: relative;
      z-index: 2;
    }

    /* ==========================================================================
       【5. 隨時間輪播特效 (Highlight & Dim)】
       ========================================================================== */
    /* 被選中的 Highlight 亮起卡片 */
    .card.highlight {
      transform: scale(var(--highlight-scale));
      border-color: var(--highlight-border);
      box-shadow: var(--highlight-glow);
      opacity: 1 !important;
      filter: blur(0px) !important;
      z-index: 20; /* 確保浮在最上層 */
    }

    .card.highlight .card-stamp {
      opacity: 0.8;
    }

    /* 輪播開啟時，非選中的卡片自動縮小與模糊化 */
    .masonry-wall.active-carousel .card:not(.highlight) {
      opacity: var(--dim-opacity);
      filter: var(--dim-blur);
      transform: scale(0.97);
    }

    /* 錯誤訊息框 */
    .message-box {
      text-align: center;
      padding: 40px;
      background: rgba(255, 255, 255, 0.8);
      border-radius: 12px;
      color: var(--text-sub);
      font-size: 1.05rem;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <!-- 背景動畫：日式櫻花飄落 Canvas -->
  <canvas id="sakuraCanvas"></canvas>

  <div class="container">
    <!-- 頁首標題區 -->
    <header class="header">
      <h1><i class="fa-solid fa-fan"></i> 朋友對我的動態留言板 <i class="fa-solid fa-fan"></i></h1>
      <p> Sakura Memory Wall - 感謝相遇的每一份祝福 </p>
    </header>

    <!-- CSV 網址輸入與輪播控制面板 -->
    <section class="control-panel">
      <div class="input-row">
        <div class="input-group">
          <input type="text" id="csvUrlInput" placeholder="請在此貼上 Google 試算表 CSV 網址..." />
        </div>
        <button class="btn" onclick="loadCSVData()">
          <i class="fa-solid fa-cloud-arrow-down"></i> 載入留言板
        </button>
      </div>

      <!-- 展覽輪播播放控制區 -->
      <div class="carousel-controls">
        <span class="status-badge" id="carouselStatus">展覽輪播中 (每 3 秒)</span>
        <button class="btn btn-secondary" id="toggleCarouselBtn" onclick="toggleCarousel()">
          <i class="fa-solid fa-pause"></i> 暫停輪播
        </button>
        <button class="btn btn-secondary" onclick="prevCard()">
          <i class="fa-solid fa-chevron-left"></i> 上一張
        </button>
        <button class="btn btn-secondary" onclick="nextCard()">
          下一張 <i class="fa-solid fa-chevron-right"></i>
        </button>
      </div>
    </section>

    <!-- 載入動畫 (預設隱藏) -->
    <div id="loadingView" class="loading-container" style="display: none;">
      <div class="sakura-spinner">
        <i class="fa-solid fa-compact-disc"></i>
      </div>
      <div class="loading-text">讀取留言中...</div>
    </div>

    <!-- 留言卡片瀑布流牆面 -->
    <main id="masonryWall" class="masonry-wall"></main>
  </div>

  <script>
    /* ==========================================================================
       【6. 輪播秒數與參數控制區 (方便後續調整修改)】
       ========================================================================== */
    const CONFIG = {
      // ----------------------------------------------------------------------
      // 【輪播秒數設定】 (單位：毫秒)
      // 預設為 3000 (即 3 秒)。若要改為 5 秒，請改成 5000。
      // ----------------------------------------------------------------------
      CAROUSEL_INTERVAL: 3000, 
      
      // 背景飄落櫻花數量
      SAKURA_COUNT: 40,
      
      // 預設示範 CSV 資料 (若未貼上 URL 時自動預設帶入)
      DEMO_CSV_DATA: `時間戳記,名字,悄悄話
2026/10/18 下午 2:30:15,小明,這段時間認識你真的太棒了！祝你前端開發順順利利，Bug 通通退散！🌸
2026/10/18 下午 3:12:00,櫻花仙子,"這是一段帶有逗號, 以及換行符號的悄悄話：
願你的程式碼永遠像春天的櫻花一樣優雅璀璨！祝天天開心～"
2026/10/18 下午 4:05:40,阿傑,下次有空再一起出來喝咖啡聊技術！這個日式留言板做得很精緻耶👍
2026/10/18 下午 5:20:11,匿名朋友,悄悄對你說：其實你一直都是大家的榜樣，繼續保持這份熱情吧！
2026/10/18 下午 6:00:00,佐藤同學,祝你平安順心，願這片櫻花牆帶給你滿滿的正能量與好心情！✨`
    };

    /* 全局變數 */
    let carouselTimer = null;   // 計時器指針
    let isPlaying = true;       // 輪播狀態
    let currentIndex = 0;       // 當前聚焦的卡片索引
    let cardElements = [];      // DOM 卡片陣列

    /* ==========================================================================
       【7. 健壯 CSV 解析器 (解析引號、逗號與多行換行)】
       ========================================================================== */
    function parseCSV(text) {
      const lines = [];
      let row = [];
      let currentField = '';
      let insideQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const nextChar = text[i + 1];

        // 處理雙引號
        if (char === '"') {
          if (insideQuotes && nextChar === '"') {
            currentField += '"';
            i++; // 跳過轉義雙引號
          } else {
            insideQuotes = !insideQuotes;
          }
        } 
        // 處理欄位分隔符號逗號
        else if (char === ',' && !insideQuotes) {
          row.push(currentField.trim());
          currentField = '';
        } 
        // 處理換行 (CRLF 或 LF)
        else if ((char === '\r' || char === '\n') && !insideQuotes) {
          if (char === '\r' && nextChar === '\n') {
            i++; // 跳過 \n
          }
          row.push(currentField.trim());
          if (row.length > 0 && row.some(field => field !== '')) {
            lines.push(row);
          }
          row = [];
          currentField = '';
        } 
        else {
          currentField += char;
        }
      }

      // 處理最後一行
      if (currentField !== '' || row.length > 0) {
        row.push(currentField.trim());
        if (row.some(field => field !== '')) {
          lines.push(row);
        }
      }

      return lines;
    }

    /* ==========================================================================
       【8. 資料讀取與載入 (fetch)】
       ========================================================================== */
    async function loadCSVData() {
      const urlInput = document.getElementById('csvUrlInput').value.trim();
      const loadingView = document.getElementById('loadingView');
      const masonryWall = document.getElementById('masonryWall');

      stopCarousel();
      masonryWall.innerHTML = '';
      loadingView.style.display = 'flex';

      let csvText = '';

      try {
        if (urlInput) {
          // 使用 fetch() 讀取使用者貼上的 Google 試算表 CSV URL
          const response = await fetch(urlInput);
          if (!response.ok) throw new Error(`HTTP 錯誤! 狀態碼: ${response.status}`);
          csvText = await response.text();
        } else {
          // 若未輸入網址，模擬網路載入 800ms 後顯示 Sample 資料
          await new Promise(resolve => setTimeout(resolve, 800));
          csvText = CONFIG.DEMO_CSV_DATA;
        }

        // 解析 CSV 內容
        const parsedRows = parseCSV(csvText);

        // 移除第一行 CSV 表頭 (時間戳記, 名字, 悄悄話)
        const dataRows = parsedRows.slice(1);

        // 映射為資料物件
        const messages = dataRows.map(row => ({
          timestamp: row[0] || '',
          name: row[1] || '無名氏',
          content: row[2] || ''
        })).filter(msg => msg.content !== ''); // 過濾空白留言

        loadingView.style.display = 'none';

        if (messages.length === 0) {
          masonryWall.innerHTML = `<div class="message-box">尚無留言內容，或者 CSV 解析內容為空。</div>`;
          return;
        }

        // 渲染動態卡片
        renderCards(messages);

      } catch (err) {
        console.error("載入失敗:", err);
        loadingView.style.display = 'none';
        masonryWall.innerHTML = `
          <div class="message-box" style="color: #c9526f;">
            <i class="fa-solid fa-circle-exclamation"></i> 讀取資料失敗！<br/>
            <span style="font-size:0.85rem; color:#888;">請確認 Google 試算表已發布為 CSV 且連結正確。</span>
          </div>`;
      }
    }

    /* ==========================================================================
       【9. 動態生成留言卡片】
       ========================================================================== */
    function renderCards(messages) {
      const masonryWall = document.getElementById('masonryWall');
      masonryWall.innerHTML = '';
      cardElements = [];

      messages.forEach((msg, idx) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.dataset.index = idx;

        // 生成日式繪馬/短冊風格卡片結構
        card.innerHTML = `
          <div class="card-header">
            <span class="author-name"><i class="fa-solid fa-bookmark"></i> ${escapeHTML(msg.name)}</span>
            <span class="post-time">${escapeHTML(msg.timestamp)}</span>
          </div>
          <div class="card-content">${escapeHTML(msg.content)}</div>
          <div class="card-stamp">絆</div>
        `;

        // 滑鼠懸停卡片時自動暫停輪播，離開時恢復
        card.addEventListener('mouseenter', () => {
          if (isPlaying) stopCarouselTimerOnly();
        });
        card.addEventListener('mouseleave', () => {
          if (isPlaying) startCarouselTimerOnly();
        });

        // 點擊卡片可手動聚焦
        card.addEventListener('click', () => {
          currentIndex = idx;
          highlightCard(currentIndex);
        });

        masonryWall.appendChild(card);
        cardElements.push(card);
      });

      // 啟動 3 秒輪播
      startCarousel();
    }

    // HTML 轉義字元防範 XSS
    function escapeHTML(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    /* ==========================================================================
       【10. 展覽輪播 (Carousel & Highlight) 控制邏輯】
       ========================================================================== */
    function startCarousel() {
      if (cardElements.length === 0) return;

      const masonryWall = document.getElementById('masonryWall');
      masonryWall.classList.add('active-carousel');
      isPlaying = true;
      updateCarouselUI();

      currentIndex = 0;
      highlightCard(currentIndex);

      startCarouselTimerOnly();
    }

    function startCarouselTimerOnly() {
      stopCarouselTimerOnly();
      carouselTimer = setInterval(() => {
        nextCard();
      }, CONFIG.CAROUSEL_INTERVAL);
    }

    function stopCarouselTimerOnly() {
      if (carouselTimer) {
        clearInterval(carouselTimer);
        carouselTimer = null;
      }
    }

    function stopCarousel() {
      stopCarouselTimerOnly();
      isPlaying = false;
      const masonryWall = document.getElementById('masonryWall');
      if (masonryWall) masonryWall.classList.remove('active-carousel');
      updateCarouselUI();
    }

    function toggleCarousel() {
      if (isPlaying) {
        stopCarousel();
      } else {
        startCarousel();
      }
    }

    function nextCard() {
      if (cardElements.length === 0) return;
      currentIndex = (currentIndex + 1) % cardElements.length;
      highlightCard(currentIndex);
    }

    function prevCard() {
      if (cardElements.length === 0) return;
      currentIndex = (currentIndex - 1 + cardElements.length) % cardElements.length;
      highlightCard(currentIndex);
    }

    // 讓指定的卡片亮起 (Highlight) 並平滑滾動
    function highlightCard(index) {
      cardElements.forEach((card, i) => {
        if (i === index) {
          card.classList.add('highlight');
          // 平滑滾動讓聚焦卡片進入可視區 center
          card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        } else {
          card.classList.remove('highlight');
        }
      });
    }

    function updateCarouselUI() {
      const statusBadge = document.getElementById('carouselStatus');
      const toggleBtn = document.getElementById('toggleCarouselBtn');
      if (isPlaying) {
        statusBadge.textContent = '展覽輪播中 (每 3 秒)';
        statusBadge.style.background = '#fce4ec';
        statusBadge.style.color = 'var(--primary-sakura)';
        toggleBtn.innerHTML = `<i class="fa-solid fa-pause"></i> 暫停輪播`;
      } else {
        statusBadge.textContent = '輪播已暫停';
        statusBadge.style.background = '#eee';
        statusBadge.style.color = '#666';
        toggleBtn.innerHTML = `<i class="fa-solid fa-play"></i> 恢復輪播`;
      }
    }

    /* ==========================================================================
       【11. 滿屏櫻花飄落背景 (Canvas Sakura Engine)】
       ========================================================================== */
    function initSakuraAnimation() {
      const canvas = document.getElementById('sakuraCanvas');
      const ctx = canvas.getContext('2d');

      let width = (canvas.width = window.innerWidth);
      let height = (canvas.height = window.innerHeight);

      window.addEventListener('resize', () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      });

      // 建立花瓣物件
      const petals = [];
      for (let i = 0; i < CONFIG.SAKURA_COUNT; i++) {
        petals.push({
          x: Math.random() * width,
          y: Math.random() * height,
          size: Math.random() * 7 + 6,
          speedY: Math.random() * 1.1 + 0.7,
          speedX: Math.random() * 0.6 - 0.3,
          angle: Math.random() * 360,
          spin: Math.random() * 0.02 - 0.01,
          opacity: Math.random() * 0.5 + 0.4
        });
      }

      // 繪製日式櫻花花瓣形狀
      function drawPetal(x, y, size, angle, opacity) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);
        ctx.beginPath();
        ctx.fillStyle = `rgba(235, 150, 170, ${opacity})`;

        // 櫻花花瓣貝茲曲線
        ctx.moveTo(0, 0);
        ctx.bezierCurveTo(-size, -size / 2, -size, size, 0, size * 1.4);
        ctx.bezierCurveTo(size, size, size, -size / 2, 0, 0);

        ctx.fill();
        ctx.restore();
      }

      function animate() {
        ctx.clearRect(0, 0, width, height);

        petals.forEach(p => {
          p.y += p.speedY;
          p.x += p.speedX + Math.sin(p.y * 0.008) * 0.4;
          p.angle += p.spin;

          // 飄出視窗底端後重新回到頂部
          if (p.y > height + 20) {
            p.y = -20;
            p.x = Math.random() * width;
          }
          if (p.x > width + 20) p.x = -20;
          if (p.x < -20) p.x = width + 20;

          drawPetal(p.x, p.y, p.size, p.angle, p.opacity);
        });

        requestAnimationFrame(animate);
      }

      animate();
    }

    /* 頁面初始化 */
    window.addEventListener('DOMContentLoaded', () => {
      initSakuraAnimation();
      loadCSVData();
    });
  </script>
</body>
